<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="680" viewBox="75 285 1104 680" role="img" aria-labelledby="title desc">
  <title id="title">AM Labs</title>
  <desc id="desc">Logo AM Labs, A noir et M violet, traversés par un bandeau blanc portant LABS.</desc>

  <defs>
    <radialGradient id="a-top" cx="42%" cy="27%" r="78%">
      <stop offset="0" stop-color="#343638"/>
      <stop offset="0.24" stop-color="#242628"/>
      <stop offset="0.57" stop-color="#111214"/>
      <stop offset="1" stop-color="#030405"/>
    </radialGradient>
    <radialGradient id="a-bottom" cx="51%" cy="17%" r="92%">
      <stop offset="0" stop-color="#2d2f31"/>
      <stop offset="0.26" stop-color="#1d1f21"/>
      <stop offset="0.66" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#020304"/>
    </radialGradient>
    <radialGradient id="m-main" cx="31%" cy="42%" r="88%">
      <stop offset="0" stop-color="#711887"/>
      <stop offset="0.34" stop-color="#4d1063"/>
      <stop offset="0.68" stop-color="#260536"/>
      <stop offset="1" stop-color="#120019"/>
    </radialGradient>
    <linearGradient id="m-lower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#611377"/>
      <stop offset="0.48" stop-color="#350846"/>
      <stop offset="1" stop-color="#13001b"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d1f"/>
      <stop offset="0.45" stop-color="#08090a"/>
      <stop offset="1" stop-color="#020203"/>
    </linearGradient>
  </defs>

  <!-- A: surfaces -->
  <path d="M318 328H458L548 606H437L383 450L328 606H217Z" fill="url(#a-top)"/>
  <path d="M190 721H576L640 922H533L495 799H269L225 922H113Z" fill="url(#a-bottom)"/>

  <!-- A: clean outer and structural contours, no stroke along the LABS band -->
  <path d="M217 606L318 328H458L548 606" fill="none" stroke="#4a4d50" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M328 606L383 450L437 606" fill="none" stroke="#4a4d50" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M190 721L113 922H225L269 799H495L533 922H640L576 721" fill="none" stroke="#4a4d50" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- restrained silver detail on A, away from the central band -->
  <path d="M320 331H456" fill="none" stroke="#b7b9bc" stroke-width="1.25" stroke-linecap="round" opacity="0.55"/>
  <path d="M379 461L331 594" fill="none" stroke="#c2c4c7" stroke-width="1.1" stroke-linecap="round" opacity="0.48"/>
  <path d="M272 803H492L529 914" fill="none" stroke="#c1c3c6" stroke-width="1.05" stroke-linecap="round" opacity="0.44"/>

  <!-- M: surfaces -->
  <path d="M570 328H702L821 606H699L674 552V606H570ZM970 328H1096V606H984V550L957 606H839Z" fill="url(#m-main)"/>
  <path d="M592 721H674V922H657Z" fill="url(#m-lower)"/>
  <path d="M750 721H898L820 881Z" fill="url(#m-lower)"/>
  <path d="M984 721H1096V922H984Z" fill="url(#m-lower)"/>

  <!-- M: crisp contours, deliberately absent on every band-facing edge -->
  <path d="M570 606V328H702L821 606M839 606L970 328H1096V606" fill="none" stroke="#552364" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M592 721L657 922H674V721" fill="none" stroke="#552364" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M750 721L820 881L898 721" fill="none" stroke="#552364" stroke-width="3" stroke-linejoin="round"/>
  <path d="M984 721V922H1096V721" fill="none" stroke="#552364" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- LABS: one coherent Michroma typeface, converted to vector outlines -->
  <g fill="url(#letters)" stroke="#050607" stroke-width="3" stroke-linejoin="round">
    <!-- L, intentionally inclined to continue the A diagonal -->
    <path transform="matrix(1.4 0 -0.34 1 222 630)" d="M0 70L0 0L8.75 0L8.75 62.71L64.17 62.71L64.17 70Z"/>

