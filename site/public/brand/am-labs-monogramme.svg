<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="844" height="580" viewBox="90 220 844 580" role="img" aria-labelledby="title desc">
  <title id="title">AM Labs compact</title>
  <desc id="desc">Vectorisation de la version compacte AM Labs, A noir, M violet et LABS en dessous.</desc>

  <defs>
